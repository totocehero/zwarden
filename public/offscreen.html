<!doctype html>
<meta charset="utf-8" />
<title>Zwarden — clipboard</title>
<!--
  An offscreen document, never visible. It exists solely to give the MV3 service
  worker access to the clipboard: a worker has no DOM, and the clipboard requires
  one.

  The <textarea> is the buffer for document.execCommand('copy'), the only method
  that works without a focused document.
-->
<textarea id="buffer" aria-hidden="true"></textarea>
<script type="module" src="offscreen.js"></script>
