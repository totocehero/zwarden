# Baseline checks on every push and every pull request.
#
# The six commands are the ones a contributor runs locally, in the same order:
# nothing to discover in this file that is not already in the README. The size
# budget is part of it — an extension grows through small additions none of
# which seems costly, and it is that accumulation this check catches.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only. Nothing here writes to the repository, so nothing here may.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved, and a moved tag on
      # an action that runs with the repository's token is a supply-chain
      # attack with no diff to review. The version is in the comment so a
      # human can still read it; Dependabot keeps both in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run build:firefox
      # The Firefox package's own assertions only run once it exists.
      - run: npm test
